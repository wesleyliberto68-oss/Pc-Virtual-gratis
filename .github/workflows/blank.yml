name: PC Virtual Gamer

on:
  workflow_dispatch:

jobs:
  pc-virtual:
    name: Iniciar PC Virtual Gamer
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Atualizar sistema
        run: |
          sudo apt-get update
          sudo apt-get upgrade -y

      - name: Instalar interface gráfica
        run: |
          sudo apt-get install -y \
            xfce4 \
            xfce4-goodies \
            xubuntu-desktop \
            dbus-x11 \
            x11-xserver-utils

      - name: Instalar ferramentas
        run: |
          sudo apt-get install -y \
            git \
            wget \
            curl \
            unzip \
            zip \
            nano \
            htop \
            neofetch \
            mesa-utils \
            pulseaudio

      - name: Instalar suporte gráfico
        run: |
          sudo apt-get install -y \
            mesa-vulkan-drivers \
            vulkan-tools \
            libgl1-mesa-dri

      - name: Mostrar informações do PC virtual
        run: |
          echo "=============================="
          echo "       PC VIRTUAL GAMER"
          echo "=============================="
          echo ""
          echo "Sistema:"
          lsb_release -a || true
          echo ""
          echo "CPU:"
          lscpu | grep -E "Model name|CPU\(s\)" || true
          echo ""
          echo "Memória:"
          free -h
          echo ""
          echo "Armazenamento:"
          df -h /
          echo ""
          echo "GPU:"
          lspci | grep -Ei "vga|3d|display" || true
          echo ""
          echo "OpenGL:"
          glxinfo -B || true
          echo ""
          echo "Vulkan:"
          vulkaninfo --summary || true

      - name: Criar configuração do ambiente gamer
        run: |
          mkdir -p "$HOME/PC-Virtual-Gamer"
          
          cat > "$HOME/PC-Virtual-Gamer/info.txt" <<EOF
          PC Virtual Gamer
          
          Sistema: Ubuntu 22.04
          Interface: XFCE
          
          Este ambiente é temporário.
          O runner será destruído quando a execução terminar.
          EOF

      - name: Testar ambiente gráfico
        run: |
          export DISPLAY=:99

          sudo apt-get install -y xvfb

          Xvfb :99 -screen 0 1280x720x24 &
          sleep 3

          echo "Ambiente gráfico iniciado."
          echo "Resolução: 1280x720"

      - name: Teste final
        run: |
          echo ""
          echo "================================"
          echo "   PC VIRTUAL GAMER PRONTO"
          echo "================================"
          echo ""
          echo "CPU:"
          nproc
          echo ""
          echo "RAM:"
          free -h
          echo ""
          echo "Disco:"
          df -h /
          echo ""
          echo "Ambiente configurado com sucesso!"
