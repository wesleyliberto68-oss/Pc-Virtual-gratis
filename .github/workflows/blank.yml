package com.virtualpc

import android.app.Activity
import android.os.Bundle
import android.graphics.Color
import android.view.Gravity
import android.widget.*

class MainActivity : Activity() {

    private lateinit var status: TextView

    override fun onCreate(savedInstanceState: Bundle?) {
        super.onCreate(savedInstanceState)

        val root = LinearLayout(this)

        root.orientation = LinearLayout.VERTICAL
        root.setPadding(32, 32, 32, 32)
        root.setGravity(Gravity.CENTER_HORIZONTAL)

        val title = TextView(this)

        title.text = "Virtual PC"
        title.textSize = 28f
        title.setTextColor(Color.WHITE)
        title.gravity = Gravity.CENTER

        root.addView(
            title,
            LinearLayout.LayoutParams(
                -1,
                100
            )
        )

        val ram = EditText(this)

        ram.hint = "RAM (MB)"
        ram.setText("2048")
        ram.inputType = 2

        root.addView(
            ram,
            LinearLayout.LayoutParams(
                -1,
                70
            )
        )

        val start = Button(this)

        start.text = "INICIAR PC VIRTUAL"

        root.addView(
            start,
            LinearLayout.LayoutParams(
                -1,
                70
            )
        )

        val stop = Button(this)

        stop.text = "DESLIGAR"

        root.addView(
            stop,
            LinearLayout.LayoutParams(
                -1,
                70
            )
        )

        status = TextView(this)

        status.text = "Status: desligado"
        status.textSize = 16f
        status.setTextColor(Color.WHITE)

        root.addView(
            status,
            LinearLayout.LayoutParams(
                -1,
                100
            )
        )

        setContentView(root)

        start.setOnClickListener {

            val memory =
                ram.text.toString().toIntOrNull()
                    ?: 2048

            startVirtualPC(memory)
        }

        stop.setOnClickListener {

            stopVirtualPC()
        }
    }

    private var process: Process? = null

    private fun startVirtualPC(memory: Int) {

        if (process != null) {

            status.text =
                "Status: PC virtual já está ligado"

            return
        }

        val qemu =
            filesDir.resolve(
                "qemu-system-aarch64"
            )

        val disk =
            filesDir.resolve(
                "linux.img"
            )

        if (!qemu.exists()) {

            status.text =
                "Erro: QEMU não encontrado"

            return
        }

        if (!disk.exists()) {

            status.text =
                "Erro: linux.img não encontrada"

            return
        }

        try {

            qemu.setExecutable(true)

            val command = listOf(

                qemu.absolutePath,

                "-M",
                "virt",

                "-cpu",
                "cortex-a53",

                "-smp",
                "4",

                "-m",
                memory.toString(),

                "-drive",
                "file=${disk.absolutePath},format=raw,if=virtio",

                "-nographic"
            )

            process =
                ProcessBuilder(command)
                    .redirectErrorStream(true)
                    .start()

            status.text =
                "Status: PC virtual ligado"

            Thread {

                try {

                    val reader =
                        process!!
                            .inputStream
                            .bufferedReader()

                    while (true) {

                        val line =
                            reader.readLine()
                                ?: break

                        runOnUiThread {

                            status.text =
                                "QEMU: $line"
                        }
                    }

                } catch (_: Exception) {
                }

            }.start()

        } catch (e: Exception) {

            status.text =
                "Erro: ${e.message}"

            process = null
        }
    }

    private fun stopVirtualPC() {

        try {

            process?.destroy()

            process = null

            status.text =
                "Status: desligado"

        } catch (e: Exception) {

            status.text =
                "Erro ao desligar"
        }
    }

    override fun onDestroy() {

        process?.destroy()

        process = null

        super.onDestroy()
    }
}
